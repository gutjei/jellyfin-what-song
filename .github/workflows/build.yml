name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test tests/song-pause.test.cjs
      - run: dotnet test tests/SongPause.Tests.csproj -c Release
      - run: dotnet publish Jellyfin.Plugin.SongPause.csproj -c Release -o dist
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SongPause
          path: |
            dist/SongPause_*.zip
            dist/manifest.json
          if-no-files-found: error
